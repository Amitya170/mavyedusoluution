<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="logo-icon">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded soft shield for high contrast on any backdrop -->
  <rect width="92" height="92" x="4" y="4" rx="22" fill="#0b0f19" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Subtle inner radial glow -->
  <circle cx="50" cy="50" r="32" fill="url(#glowGrad)" opacity="0.15" filter="url(#subtleGlow)" />
  <!-- Continuous Intertwined 'M' and 'E' Nexus Monogram -->
  <path d="M24 68 V32 L37 48 L50 32" stroke="url(#nexusGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right 'E' Integration -->
  <path d="M50 32 H74 M42 50 H68 M50 68 H74" stroke="url(#nexusGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Central Neural Node Sparkle -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>